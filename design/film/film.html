<!doctype html>
<meta charset="utf-8">
<title>Obtanet — Smart Pools</title>
<style>
@font-face { font-family: Archivo; font-weight: 400; src: url(fonts/archivo-9beaab.ttf); }
@font-face { font-family: Archivo; font-weight: 500; src: url(fonts/archivo-6bb392.ttf); }
@font-face { font-family: Archivo; font-weight: 600; src: url(fonts/archivo-d6eabd.ttf); }
@font-face { font-family: Archivo; font-weight: 700; src: url(fonts/archivo-da6098.ttf); }

:root{
  --grund:#060B12;
  --gold:#D99000;
  --weiss:#fff; --mid:rgba(255,255,255,.72); --low:rgba(255,255,255,.44);
  --linie:rgba(255,255,255,.15); --gleis:rgba(255,255,255,.07);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--grund)}
body{font-family:Archivo,sans-serif;color:var(--weiss);font-variant-numeric:tabular-nums;
     -webkit-font-smoothing:antialiased}

/* Sicherer Rand: nichts beruehrt die Bildkante. Die Schiene ist genau
   1660 px breit — das ist die ganze nutzbare Flaeche und zugleich die
   Zielmenge des Buendels. Jede Menge im Film ist ein Stueck davon. */
.szene{position:absolute;inset:0;opacity:0;padding:92px 130px;display:flex;flex-direction:column}
.szene.an{opacity:1;transition:opacity .35s var(--ease)}

.klein{font-size:21px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.gross{font-size:76px;font-weight:500;line-height:1.08;letter-spacing:-.02em;margin-top:22px}
.riesig{font-size:118px;font-weight:500;line-height:1;letter-spacing:-.035em}
.fuss{font-size:26px;color:var(--low);font-weight:500;margin-top:auto}
.auf{opacity:0;transform:translateY(18px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.an .auf{opacity:1;transform:none}
.an .v1{transition-delay:.08s}.an .v2{transition-delay:.18s}.an .v3{transition-delay:.28s}
.an .v4{transition-delay:.38s}.an .v5{transition-delay:.48s}.an .v6{transition-delay:.58s}

/* ---------- Das eine Motiv: die Schiene ---------- */
.gleis{width:1660px;background:var(--gleis);display:flex;overflow:hidden}
.gleis .seg{width:0;height:100%;transition:width .7s linear}
.a1{background:#1B3A5C}.a2{background:#254D7A}.a3{background:#2E5C90}.a4{background:#3A6FA8}

/* Szene 1: vier eigene Schienen, jede auf demselben Massstab */
.solo{margin-top:54px}
.solo .kopf{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.solo .kopf .wer{font-size:34px;font-weight:600}
.solo .kopf .wer span{color:var(--mid);font-weight:500}
.solo .kopf .rechts{font-size:28px;color:var(--low);font-weight:500}
.solo .gleis{height:20px}

/* Szene 2 + 4: eine Schiene, vier Abschnitte */
.gleis.dick{height:34px}
.marken{display:flex;width:1660px;margin-top:20px}
.marke{border-left:1px solid rgba(255,255,255,.22);padding:18px 0 0 16px}
.marke .wer{font-size:21px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--low)}
.marke .satz{margin-top:10px;font-size:46px;font-weight:600;color:var(--gold);letter-spacing:-.01em}
.marke .preis{margin-top:6px;font-size:25px;font-weight:500;color:var(--mid)}
.marke .menge{margin-top:10px;font-size:30px;font-weight:600}

/* Szene 2: die Buendelzeile im Produkt, nur Haarlinien */
.bund{border-top:1px solid var(--linie);border-bottom:1px solid var(--linie);
  padding:36px 0;display:flex;justify-content:space-between;align-items:baseline}
.bund h3{font-size:48px;font-weight:600;letter-spacing:-.01em}
.bund .meta{font-size:27px;color:var(--mid);font-weight:500}
.zaehler{display:flex;align-items:baseline;gap:40px;margin-top:44px}
.zaehler .neben{font-size:38px;color:var(--mid);font-weight:500}

/* Szene 3: Ausschreibung — Zeilen, keine Kaesten */
.werke{margin-top:44px;border-top:1px solid var(--linie)}
.werk{position:relative;display:grid;grid-template-columns:1fr 340px 380px;align-items:baseline;gap:48px;
  padding:34px 0;border-bottom:1px solid var(--linie);
  opacity:0;transform:translateY(16px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.werk.da{opacity:1;transform:none}
.werk .name{font-size:42px;font-weight:600}
.werk .gebot{font-size:48px;font-weight:600;text-align:right}
.werk .abstand{font-size:29px;color:var(--low);text-align:right;font-weight:500;white-space:nowrap}
.werk.raus{opacity:.32}
.werk.sieger .gebot,.werk.sieger .abstand,.werk.sieger .name{color:var(--gold)}
.werk.sieger::before{content:'';position:absolute;left:-30px;top:24px;bottom:24px;width:4px;background:var(--gold)}
.stempel{margin-top:40px;font-size:27px;font-weight:600;letter-spacing:.2em;color:var(--gold);
  opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.stempel.da{opacity:1;transform:none}

/* Szene 5: Bilanz */
.bilanz{margin-top:40px;border-top:1px solid var(--linie)}
.zeile{display:grid;grid-template-columns:300px 290px 80px 190px 1fr;align-items:baseline;
  padding:28px 0;border-bottom:1px solid var(--linie)}
.zeile .f{font-size:40px;font-weight:600}
.zeile .allein,.zeile .pfeil{font-size:29px;color:var(--low);font-weight:500}
.zeile .neu{font-size:46px;font-weight:600;color:var(--gold)}
.zeile .spar{font-size:38px;font-weight:600;text-align:right}
</style>

<section class="szene" id="s1">
  <div class="auf klein" data-t="s1auge"></div>
  <div class="auf v1 gross" data-t="s1kopf"></div>
  <div id="solos"></div>
  <div class="auf v6 fuss" data-t="s1fuss"></div>
</section>

<section class="szene" id="s2">
  <div class="klein" data-t="s2auge"></div>
  <div class="gross" data-t="s2kopf"></div>
  <div class="bund" style="margin-top:52px">
    <h3 data-t="ware"></h3>
    <div class="meta" data-t="s2meta"></div>
  </div>
  <div class="gleis dick" id="gleis2" style="margin-top:46px"></div>
  <div class="marken" id="marken2"></div>
  <div class="zaehler">
    <div class="riesig" id="summe">0</div>
    <div class="neben" id="wert"></div>
  </div>
  <div class="fuss" data-t="s2fuss"></div>
</section>

<section class="szene" id="s3">
  <div class="klein" data-t="s3auge"></div>
  <div class="gross" data-t="s3kopf"></div>
  <div style="margin-top:34px;font-size:27px;color:var(--mid);font-weight:500" data-t="s3sub"></div>
  <div class="werke" id="werke"></div>
  <div class="stempel" id="stempel"></div>
</section>

<section class="szene" id="s4">
  <div class="auf klein" data-t="s4auge"></div>
  <div class="auf v1 gross" data-t="s4kopf"></div>
  <div class="auf v2" id="s4zuschlag"
       style="margin-top:32px;font-size:27px;font-weight:600;color:var(--gold)"></div>
  <div class="gleis dick" id="gleis4" style="margin-top:96px"></div>
  <div class="marken" id="marken4"></div>
  <div class="auf v6 fuss" data-t="s4fuss"></div>
</section>

<section class="szene" id="s5" style="justify-content:center">
  <div class="auf klein" data-t="s5auge"></div>
  <div class="bilanz" id="bilanz"></div>
  <div class="auf v6" style="margin-top:46px;display:flex;align-items:baseline;gap:34px">
    <div class="riesig" id="gespart">0</div>
    <div style="font-size:34px;color:var(--mid);font-weight:500;line-height:1.35" id="statt"></div>
  </div>
</section>

<section class="szene" id="s6" style="justify-content:center">
  <div class="auf gross" style="margin-top:0" data-t="claim"></div>
  <div class="auf v3" style="margin-top:56px"><img src="logo-hell.png" style="height:60px"></div>
</section>

<script>
/* ===================================================================
   Sprache. Der Film ist eine Vorlage: alles Sichtbare steht hier,
   nichts im Aufbau. Eine weitere Sprache ist ein weiterer Eintrag,
   danach film.html?sprache=xx aufrufen und neu abfilmen.
   =================================================================== */
const WORT = {
  de: {
    firmen: ['Firma A', 'Firma B', 'Firma C', 'Firma D'],
    lieferanten: ['Lieferant 1', 'Lieferant 2', 'Lieferant 3'],
    einheit: 'm³', je: 'je m³',
    s1auge: 'Ausgangslage',
    s1kopf: 'Allein ist jede Bestellung<br>zu klein für einen guten Preis.',
    s1allein: (p) => `allein −${p} %`,
    s1fuss: 'Referenzpreis CHF 160.00 je m³ · Zielmenge des Bündels 500 m³',
    s2auge: 'Bündelung',
    s2kopf: 'Vier Bestellungen,<br>ein Volumen.',
    ware: 'Beton C25/30',
    s2meta: '4 Firmen · Sammelphase · schliesst in 4 Tagen',
    s2wert: (w) => `Listenwert ${w}`,
    s2fuss: 'Jede Firma behält ihre eigene Menge — verhandelt wird die Summe.',
    s3auge: 'Ausschreibung',
    s3kopf: 'Die Lieferanten bieten<br>auf das ganze Volumen.',
    s3sub: '500 m³ ausgeschrieben · Referenzpreis CHF 160.00 je m³',
    s3ab: (p) => `−${p} % gegenüber Referenz`,
    s3stempel: (n, p) => `ZUSCHLAG · ${n.toUpperCase()} · 500 m³ ZU CHF ${p} JE m³`,
    s4auge: 'Verteilung',
    s4kopf: 'Der Rabatt richtet sich nach<br>der eingebrachten Menge.',
    s4zuschlag: (n, p) => `Zuschlag ${n} · 500 m³ zu CHF ${p} je m³`,
    s4fuss: 'Der Zuschlag gilt für das ganze Volumen. Innerhalb des Bündels bestimmt die eingebrachte Menge die Stufe — höchstens 20 %.',
    s5auge: 'Was die Bündelung bringt',
    s5allein: (p) => p === 0 ? 'allein kein Rabatt' : `allein −${p} %`,
    s5spar: (b) => `${b} gespart`,
    s5statt: (b) => `gespart statt ${b} allein.<br>Zusammen mehr als das Dreifache.`,
    claim: 'Gemeinsam einkaufen,<br>direkt verhandeln.',
  },
  en: {
    firmen: ['Company A', 'Company B', 'Company C', 'Company D'],
    lieferanten: ['Supplier 1', 'Supplier 2', 'Supplier 3'],
    einheit: 'm³', je: 'per m³',
    s1auge: 'Starting point',
    s1kopf: 'On its own, every order<br>is too small for a good price.',
    s1allein: (p) => `alone −${p} %`,
    s1fuss: 'Reference price CHF 160.00 per m³ · bundle target 500 m³',
    s2auge: 'Bundling',
    s2kopf: 'Four orders,<br>one volume.',
    ware: 'Concrete C25/30',
    s2meta: '4 companies · collecting · closes in 4 days',
    s2wert: (w) => `List value ${w}`,
    s2fuss: 'Every company keeps its own quantity — what gets negotiated is the sum.',
    s3auge: 'Tender',
    s3kopf: 'Suppliers bid on<br>the entire volume.',
    s3sub: '500 m³ tendered · reference price CHF 160.00 per m³',
    s3ab: (p) => `−${p} % against reference`,
    s3stempel: (n, p) => `AWARDED · ${n.toUpperCase()} · 500 m³ AT CHF ${p} PER m³`,
    s4auge: 'Allocation',
    s4kopf: 'The discount follows<br>the volume you bring.',
    s4zuschlag: (n, p) => `Awarded to ${n} · 500 m³ at CHF ${p} per m³`,
    s4fuss: 'The award covers the whole volume. Inside the bundle, the quantity you bring sets your tier — 20 % at most.',
    s5auge: 'What bundling delivers',
    s5allein: (p) => p === 0 ? 'alone no discount' : `alone −${p} %`,
    s5spar: (b) => `${b} saved`,
    s5statt: (b) => `saved instead of ${b} alone.<br>Together, more than three times as much.`,
    claim: 'Buy together,<br>negotiate directly.',
  },
};
const SPRACHE = new URLSearchParams(location.search).get('sprache') || 'de';
const W = WORT[SPRACHE] || WORT.de;

/* ===================================================================
   Die Zahlen. Nachgerechnet, und sie muessen zusammenbleiben:
   80 + 110 + 145 + 165 = 500 m3 · Referenz 160.00 → Listenwert 80'000
   Zuschlag 133.60 (−16.5 %) → 500 x 133.60 = 66'800 → gespart 13'200
   =================================================================== */
const ZIEL = 500, REFERENZ = 160, ZUSCHLAG = '133.60', BREITE = 1660;
const FIRMEN = [
  { m3:  80, allein: 0, satz: 10, preis: '144.00', spart:  1280 },
  { m3: 110, allein: 3, satz: 14, preis: '137.60', spart:  2464 },
  { m3: 145, allein: 6, satz: 18, preis: '131.20', spart:  4176 },
  { m3: 165, allein: 8, satz: 20, preis: '128.00', spart:  5280 },
];
const GEBOTE = [
  { preis: '142.40', ab: 11 },
  { preis: '138.40', ab: 13.5 },
  { preis: ZUSCHLAG, ab: 16.5 },
];

const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const schlaf = (ms) => new Promise(r => setTimeout(r, ms));
const zahl = (n) => n.toLocaleString('de-CH').replace(/[,‘’  ]/g, "'");
const chf  = (n) => 'CHF ' + zahl(Math.round(n));
const menge = (n) => zahl(Math.round(n)) + ' ' + W.einheit;
const breit = (m) => (BREITE * m / ZIEL);

$$('[data-t]').forEach(el => { el.innerHTML = W[el.dataset.t]; });

function zeig(id) {
  $$('.szene').forEach(s => { s.style.transition = 'none'; s.classList.remove('an'); });
  return new Promise(r => requestAnimationFrame(() => {
    const el = $(id); el.style.transition = ''; el.classList.add('an'); r();
  }));
}
/* weich: mit Auslauf. Wenn eine Zahl neben einem Balken mitlaeuft,
   muss sie gleichmaessig zaehlen, sonst eilt sie ihm voraus. */
function zaehle(el, von, bis, dauer, form, weich = true) {
  const start = performance.now();
  return new Promise(fertig => {
    (function tick(t) {
      const p = Math.min(1, (t - start) / dauer);
      const e = weich ? 1 - Math.pow(1 - p, 3) : p;
      el.textContent = form(Math.round((von + (bis - von) * e) * 100) / 100);
      p < 1 ? requestAnimationFrame(tick) : fertig();
    })(performance.now());
  });
}

/* Szene 1 — vier eigene Schienen auf demselben Massstab */
$('#solos').innerHTML = FIRMEN.map((f, i) => `
  <div class="solo auf v${i + 2}">
    <div class="kopf">
      <div class="wer">${W.firmen[i]} <span>· ${menge(f.m3)}</span></div>
      <div class="rechts">${W.s1allein(f.allein)}</div>
    </div>
    <div class="gleis"><i class="seg a${i + 1}" data-breit="${breit(f.m3).toFixed(1)}"></i></div>
  </div>`).join('');

/* Szene 2 und 4 — eine Schiene, vier Abschnitte */
const segmente = (id) => FIRMEN.map((f, i) =>
  `<i class="seg a${i + 1}" data-breit="${breit(f.m3).toFixed(1)}"></i>`).join('');
$('#gleis2').innerHTML = segmente();
$('#gleis4').innerHTML = segmente();
$('#marken2').innerHTML = FIRMEN.map((f, i) =>
  `<div class="marke" style="width:${breit(f.m3).toFixed(1)}px">
     <div class="wer">${W.firmen[i]}</div><div class="menge">${menge(f.m3)}</div></div>`).join('');
$('#marken4').innerHTML = FIRMEN.map((f, i) =>
  `<div class="marke" style="width:${breit(f.m3).toFixed(1)}px">
     <div class="wer">${W.firmen[i]}</div>
     <div class="satz" id="satz${i}">−0 %</div>
     <div class="preis">${menge(f.m3)} · CHF ${f.preis}</div></div>`).join('');
$('#wert').textContent = W.s2wert(chf(ZIEL * REFERENZ));
$('#s4zuschlag').textContent = W.s4zuschlag(W.lieferanten[2], ZUSCHLAG);

/* Szene 3 — die Gebote */
$('#werke').innerHTML = GEBOTE.map((g, i) =>
  `<div class="werk" id="w${i}"><div class="name">${W.lieferanten[i]}</div>
     <div class="gebot">•••</div><div class="abstand"></div></div>`).join('');
$('#stempel').textContent = W.s3stempel(W.lieferanten[2], ZUSCHLAG);

/* Szene 5 — die Bilanz */
$('#bilanz').innerHTML = FIRMEN.map((f, i) =>
  `<div class="zeile auf v${i + 1}"><div class="f">${W.firmen[i]}</div>
     <div class="allein">${W.s5allein(f.allein)}</div><div class="pfeil">→</div>
     <div class="neu">−${f.satz} %</div>
     <div class="spar">${W.s5spar(chf(f.spart))}</div></div>`).join('');
$('#statt').innerHTML = W.s5statt(chf(4032));

async function film() {
  await schlaf(500);

  /* 1 — allein: vier kurze Balken auf einer Schiene, die 500 m3 lang ist */
  await zeig('#s1'); await schlaf(300);
  $$('#s1 .seg').forEach((s, i) => setTimeout(() => {
    s.style.transition = 'width .9s var(--ease)';
    s.style.width = s.dataset.breit + 'px';
  }, 120 * i));
  await schlaf(4600);

  /* 2 — die vier Mengen legen sich hintereinander und fuellen die Schiene */
  await zeig('#s2'); await schlaf(500);
  const dauer = 2600;
  zaehle($('#summe'), 0, ZIEL, dauer, menge, false);
  for (const [i, s] of $$('#gleis2 .seg').entries()) {
    s.style.transitionDuration = (dauer * FIRMEN[i].m3 / ZIEL) + 'ms';
    s.style.width = s.dataset.breit + 'px';
    await schlaf(dauer * FIRMEN[i].m3 / ZIEL);
  }
  await schlaf(2200);

  /* 3 — Ausschreibung: erst verdeckt, dann offen, dann der Zuschlag */
  await zeig('#s3'); await schlaf(450);
  const werke = GEBOTE.map((g, i) => $('#w' + i));
  for (const el of werke) { el.classList.add('da'); await schlaf(300); }
  await schlaf(800);
  for (const [i, el] of werke.entries()) {
    el.querySelector('.gebot').textContent = 'CHF ' + GEBOTE[i].preis;
    el.querySelector('.abstand').textContent = W.s3ab(GEBOTE[i].ab);
    await schlaf(400);
  }
  await schlaf(650);
  werke[0].classList.add('raus'); werke[1].classList.add('raus');
  werke[2].classList.add('sieger');
  $('#stempel').classList.add('da');
  await schlaf(2500);

  /* 4 — Verteilung: dieselbe Schiene, jetzt zaehlt jede Stufe hoch */
  await zeig('#s4'); await schlaf(300);
  $$('#gleis4 .seg').forEach(s => {
    s.style.transition = 'width .8s var(--ease)';
    s.style.width = s.dataset.breit + 'px';
  });
  await schlaf(900);
  await Promise.all(FIRMEN.map((f, i) =>
    zaehle($('#satz' + i), 0, f.satz, 1200, (n) => '−' + Math.round(n) + ' %')));
  await schlaf(3400);

  /* 5 — was es bringt */
  await zeig('#s5'); await schlaf(1300);
  await zaehle($('#gespart'), 0, 13200, 1500, chf);
  await schlaf(3300);

  /* 6 — Abbinder. Er steht drei Sekunden, dann wird es schwarz.
     Der Film laeuft in der Seite in Endlosschleife: das Schwarz am Ende
     und am Anfang ist der Atemzug dazwischen, mehr nicht — beim
     Zuschneiden bleiben davon je rund drei Zehntel stehen. */
  await zeig('#s6'); await schlaf(3000);
  $$('.szene').forEach(x => x.classList.remove('an'));
  await schlaf(600);
  document.title = 'ENDE';
}
if (location.hash !== '#standbild') {
  /* Erst wenn die Schriften da sind. Faengt der Film vorher an, wird die
     erste Szene mit der Ersatzschrift aufgebaut und springt dann um. */
  window.addEventListener('load', async () => {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    setTimeout(film, 200);
  });
}
</script>
